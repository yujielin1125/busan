function genSlots(d){
  var w=dayWindow(d),keys=(PACE[dg(d,"pace")]||PACE.normal).slice(),out=[],dl=(state.del&&state.del[d])||[];

    var res=ns.slice();
    old.forEach(function(o,oi){if(String(o.k).charAt(0)!=="x")return;var at=0,j;

function reflow(d){
  var sl=state.plan[d]||[],w=dayWindow(d),cur=w.start,anc=startC(d);
  sl.forEach(function(s){
    if(s.st){s.t=Math.round(cur/5)*5;s.warn="";return;}
    var it=slotItem(s),tv=15;
    if(it&&it.c){tv=travel(anc,it.c);anc=it.c;}
    var t0=cur+tv,mt=MINT[s.k]||0;
    if(s.hint==="night")mt=Math.max(mt,1140);
    if(s.hint==="food")mt=Math.max(mt,660);
    if(s.hint==="cafe")mt=Math.max(mt,600);
    t0=Math.max(t0,mt);
    if(it&&it.p&&s.fix==null){var hh=hoursFor(it.p,wdOf(d));if(hh){if(t0<hh.o&&hh.o-t0<=120)t0=hh.o;if(hh.br&&t0>hh.br[0]-20&&t0<hh.br[1]&&hh.br[1]-t0<=90)t0=hh.br[1];}}

function moodOk(m,p){
  if(p.cat==="stay")return false;
  if(m==="eat")return p.cat==="food";
  if(m==="cafe")return p.cat==="cafe"||p.cat==="rest";
  if(m==="sight")return p.cat==="sight";
  if(m==="shop")return p.cat==="shop";
  if(m==="night")return p.cat==="night";
  if(m==="rain")return !!p.indoor;
  return true;
}
function options(d,idx,mood,offset,all){
  var sl=state.plan[d][idx],an=anchorFor(d,idx),used=usedIds();
  var list=state.places.filter(function(p){return p.on&&!used[p.id]&&moodOk(mood,p);}).map(function(p){
    var tv=travel(an.c,coordOf(p));
    var sc=(p.pinned?3:0)+(p.pri||1)-tv/12+(p.cat===sl.hint?1:0)+(p.rating?(p.rating-4)*1.5+Math.min(Math.log10(p.rc||1),4)*0.25:0);
    var wn=openWarn(p,sl.t,sheet?sheet.d:d);return {p:p,tv:tv,sc:sc-(wn?6:0),an:an.name,wn:wn};
  }).sort(function(a,b){return b.sc-a.sc;});
  if(all)return list;
  if(!list.length)return [];
  var n=list.length,out=[];
  for(var i=0;i<Math.min(3,n);i++)out.push(list[(offset+i)%n]);
  if(!out.some(function(o){return !o.p.pinned;})){
    var extra=list.filter(function(o){return !o.p.pinned&&out.indexOf(o)<0;})[0];
    if(extra&&out.length)out[out.length-1]=extra;
  }

}

function modeText(a,b){if(!a||!b)return "";var k=km(a,b),tv=travel(a,b);if(k<0.9)return "步行約 "+Math.max(5,Math.round(k*13))+" 分";if(k<4)return "公車或計程車約 "+tv+" 分";return "地鐵或計程車約 "+tv+" 分";}

  var day=x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate());return {iso:day+"T"+p(Math.floor(m/60))+":"+p(m%60)+":00",txt:(x.getMonth()+1)+"/"+x.getDate()+" "+p(Math.floor(m/60))+":"+p(m%60)};}

/* import */
function parseCSV(t){
  var rows=[],r=[],f="",q=false;t=t.replace(/^﻿/,"");
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){r.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";rows.push(r);r=[];}
    else f+=c;}
  if(f||r.length){r.push(f);rows.push(r);}
  return rows.filter(function(x){return x.some(function(y){return y.trim();});});
}
function nearestArea(lat,lng){
  if(!(lat>34.8&&lat<35.5&&lng>128.7&&lng<129.5))return "待分類";
  var best=null,bd=1e9;Object.keys(AREAS).forEach(function(a){var d=km([lat,lng],AREAS[a]);if(d<bd){bd=d;best=a;}});
  return bd<6?best:"待分類";
}
function mk(name,lat,lng,note,lc){
  var area=(lat!=null)?nearestArea(lat,lng):"待分類";
  return {id:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,area:area,cat:lc||"other",lat:lat,lng:lng,indoor:false,pinned:true,pri:2,hl:note||"",src:"import",on:true};
}

}
/* ===== Google 地圖網址 → 景點 ===== */
function olcDecode(code){
  var A="23456789CFGHJMPQRVWX",c=String(code).toUpperCase().replace("+","");
  if(c.length<10||/[^23456789CFGHJMPQRVWX]/.test(c))return null;
  var lat=-90,lng=-180,res=20,i;
  for(i=0;i<10;i+=2){lat+=A.indexOf(c[i])*res;lng+=A.indexOf(c[i+1])*res;res/=20;}
  var la=0.000125,lo=0.000125;
  for(i=10;i<c.length;i++){var d=A.indexOf(c[i]);la/=5;lo/=4;lat+=Math.floor(d/4)*la;lng+=(d%4)*lo;}
  return [lat+la/2,lng+lo/2];
}
function s2ToLatLng(hex){
  var id=BigInt("0x"+hex),face=Number(id>>61n),low=id&(-id),L;
  var tz=0;while(((low>>BigInt(tz))&1n)===0n)tz++;L=30-(tz>>1);
  var PI=[[0,1,3,2],[0,2,3,1],[3,2,0,1],[3,1,0,2]],PO=[1,0,0,3],o=face&1,i=0,j=0;
  for(var k=1;k<=L;k++){var pos=Number((id>>BigInt(2*(30-k)+1))&3n),ij=PI[o][pos];i=i*2+(ij>>1);j=j*2+(ij&1);o^=PO[pos];}
  var sz=Math.pow(2,30-L),ci=(i*sz+sz/2)/Math.pow(2,30),cj=(j*sz+sz/2)/Math.pow(2,30);
  function uv(s){return s>=0.5?(4*s*s-1)/3:(1-4*(1-s)*(1-s))/3;}
  var u=uv(ci),v=uv(cj),x,y,z;
  switch(face){case 0:x=1;y=u;z=v;break;case 1:x=-u;y=1;z=v;break;case 2:x=-u;y=-v;z=1;break;case 3:x=-1;y=-v;z=-u;break;case 4:x=v;y=-1;z=-u;break;default:x=v;y=u;z=-1;}
  return [Math.atan2(z,Math.hypot(x,y))*180/Math.PI,Math.atan2(y,x)*180/Math.PI,L];
}
function gmParse(u){
  u=String(u).trim();if(!/^https?:\/\//i.test(u))return {err:"不是網址"};
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(u))return {short:true};
  var nm="",m=u.match(/\/maps\/place\/([^\/?#]+)/);
  if(m){try{nm=decodeURIComponent(m[1].replace(/\+/g," "));}catch(e){nm=m[1].replace(/\+/g," ");}}
  nm=nm.split(/\s*[,，]\s*/)[0].replace(/\s*\d+[\w-]*\s+[A-Za-z][\w.-]*(?:daero|ro|gil)\b.*$/i,"").replace(/\s*[·\n].*$/,"").trim();
  var du;try{du=decodeURIComponent(u);}catch(e){du=u;}
  if(!nm){var qm=u.match(/[?&]q=([^&#]+)/);if(qm){try{nm=decodeURIComponent(qm[1].replace(/\+/g," "));}catch(e){nm=qm[1].replace(/\+/g," ");}if(/^-?\d+\.\d+,\s*-?\d+\.\d+$/.test(nm))nm="";nm=nm.split(/\s*[,，]\s*/)[0].replace(/\s*\d+[\w-]*\s+[A-Za-z][\w.-]*(?:daero|ro|gil)\b.*$/i,"").trim();}}
  var lat=null,lng=null,x;
  if((x=du.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))){lat=+x[1];lng=+x[2];}
  else if((x=du.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+),(-?\d+\.\d+)/))){lat=+x[1];lng=+x[2];}
  else if((x=du.match(/!20s([23456789CFGHJMPQRVWX]{8}\+[23456789CFGHJMPQRVWX]{2,})/i))){var o=olcDecode(x[1]);if(o){lat=o[0];lng=o[1];}}
  else if((x=du.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))){lat=+x[1];lng=+x[2];}
  if(lat==null&&(x=du.match(/(?:1s|ftid=)0x([0-9a-f]{16}):0x[0-9a-f]+/i))){try{var q=s2ToLatLng(x[1]);if(isFinite(q[0])&&isFinite(q[1])){lat=q[0];lng=q[1];}}catch(e){}}
  if(!nm)return {err:"網址裡找不到店名，請用 Google 地圖『分享』或直接複製店家頁面的網址"};
  if(lat==null)return {err:"找不到座標（"+nm+"）"};
  if(lat<34.8||lat>35.5||lng<128.7||lng>129.5)return {err:nm+" 不在釜山範圍內"};
  return {name:nm,lat:lat,lng:lng,url:u};
}

    var q=JSON.stringify(id?await mcp.callTool("host:claude_browser","get_page_text",{tabId:id}):await mcp.callTool("host:claude_browser","get_page_text",{}));m=q.match(RP);if(m)return m[0];if(!fb&&(m=q.match(RQ)))fb=m[0];}

async function addUrls(txt){

  if(!urls.length)return {added:0,msg:"沒有看到網址，請貼上 Google 地圖網址（可一次貼多個，一行一個）。"};

    if(r.short){try{msgUrl="展開短網址中（"+(n0+1)+"/"+urls.length+"）…";render();r=gmParse(await resolveShort(u));}catch(e){r={err:"短網址無法在這裡展開（需要用 Claude 桌面版開啟頁面）。請改貼完整網址"};}}

function importText(name,text){
  var lc=listCat(name),list=[];

    if(/\.(json|geojson)$/i.test(name)||/^\s*[\[{]/.test(text)){
      var o=JSON.parse(text),fs=o.features||(Array.isArray(o)?o:[]);
      fs.forEach(function(f){var pr=f.properties||f,nm=pr.Title||pr.title||pr.name||(pr.location&&pr.location.name);if(!nm)return;
        var co=f.geometry&&f.geometry.coordinates,lat=null,lng=null;
        if(co&&co.length>=2&&(co[0]||co[1])){lng=+co[0];lat=+co[1];}
        list.push(mk(nm,lat,lng,pr.Note||pr.Comment||"",lc));});
    }else{
      var rows=parseCSV(text);if(!rows.length)throw new Error("empty");
      var hd=rows[0].map(function(x){return x.trim().toLowerCase();});
      var ti=hd.indexOf("title");if(ti<0)ti=hd.indexOf("標題");if(ti<0)ti=hd.indexOf("名稱");if(ti<0)ti=0;
      var ni=hd.indexOf("note"),ci=hd.indexOf("comment");

    }
  }catch(e){msgImport+=name+"：讀不出來，請確認是 Takeout 匯出的 CSV 或 JSON。\n";render();return;}

  else if(a==="pick"){var sl=state.plan[sheet.d][sheet.i];sl.pid=el.getAttribute("data-id");sl.c=null;sl.st="";sl.why="";sheet=null;save();render();toast("已排進行程");}

  else if(a==="lostt"){state.lostOpen=!state.lostOpen;save();render();}
  else if(a==="fotoggle"){state.fo=!state.fo;save();render();}
  else if(a==="fapply"){applyFriend(+el.getAttribute("data-fi"),d);}
  else if(a==="addUrl"){var ui=document.getElementById("urlIn");addUrls(ui?ui.value:"").then(function(r){msgUrl=r.msg;render();if(r.added&&sampleFn)classify();});}
  else if(a==="delPlace"){var dp=state.places[i];if(!dp)return;if(state.delArm!==i){state.delArm=i;render();return;}
    state.gone=state.gone||{};state.gone[dp.name]=1;for(var dd in state.plan)(state.plan[dd]||[]).forEach(function(q){if(q.pid===dp.id){q.pid=null;q.c=null;q.st="";q.why="";}});
    state.places.splice(i,1);state.delArm=null;save();render();toast("已刪除「"+dp.name+"」");}
  else if(a==="shMake"){shareMake().then(function(c){shareCode=c;msgShare="已產生（約 "+Math.round(c.length/1024*10)/10+" KB）。";var ok=false;try{navigator.clipboard.writeText(c).then(function(){msgShare+="已複製到剪貼簿，可直接貼到 LINE。";render();},function(){msgShare+="自動複製失敗，請長按下方文字框全選複製。";render();});ok=true;}catch(e){}if(!ok){msgShare+="請長按下方文字框全選複製。";}render();}).catch(function(e){msgShare="產生失敗："+e.message;render();});}
  else if(a==="shImport"){var si=document.getElementById("shIn"),tx=si?si.value:"";if(!tx.trim()){msgShare="請先貼上行程代碼。";render();return;}
    if(!shareArm){shareArm=true;msgShare="";render();var si2=document.getElementById("shIn");if(si2)si2.value=tx;return;}
    shareArm=false;shareRead(tx).then(function(o){SHK.forEach(function(k){if(o[k]!==undefined)state[k]=o[k];});state.mig6=1;state.mig7=1;state.delArm=null;save();msgShare="已匯入："+o.places.length+" 間景點。";render();}).catch(function(e){msgShare="匯入失敗："+e.message+"。請確認整串代碼都有貼上。";render();});}
  else if(a==="must"){state.places[i].must=!state.places[i].must;save();render();}
  else if(a==="toggle"){state.places[i].on=!state.places[i].on;save();render();}
  else if(a==="clearDemo"){state.places=state.places.filter(function(p){return p.src!=="demo";});state.demo=false;state.plan={};rebuild();save();msgImport="示範資料已清除。";render();}
  else if(a==="resetDemo"){state.places=state.places.concat(demoPlaces());state.demo=true;save();render();}
  else if(a==="pasteAdd"){var ta=document.getElementById("pasteIn"),ls=(ta.value||"").split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
    var n=addPlaces(ls.map(function(nm){return mk(nm,null,null,"");}));if(n&&state.demo){state.places=state.places.filter(function(p){return p.src!=="demo";});state.demo=false;}
    msgImport="加入 "+n+" 間店。";save();render();}
  else if(a==="setHotel"){var hp=state.places[i];state.set.hotelName=hp.name;if(AREAS[hp.area])state.set.hotelArea=hp.area;state.set.hotelCoord=(hp.lat!=null)?[hp.lat,hp.lng]:null;rebuild();save();render();toast("已設為飯店");}
  else if(a==="qa"){var qn=(document.getElementById("qaName").value||"").trim();if(!qn)return;var qp=mk(qn,null,null,"",document.getElementById("qaCat").value);qp.area=document.getElementById("qaArea").value;qp.indoor=(qp.cat==="food"||qp.cat==="cafe"||qp.cat==="shop");msgImport=addPlaces([qp])?"已新增："+qn:"清單裡已經有「"+qn+"」。";save();render();}
  else if(a==="dpace"){dset(d).pace=v;state.del=state.del||{};state.del[d]=[];rebuild();autoPlan(false);save();render();}
  else if(a==="d1opt"){var k1=el.getAttribute("data-k");if(k1==="direct")state.set.direct=(v==="1");else if(k1==="imm")state.set.imm=+v;else if(k1==="transit")state.set.transit=v;
    var had=(state.plan[1]||[]).some(function(s){return slotItem(s);});rebuild();if(had){(state.plan[1]||[]).forEach(function(s){if(!s.st){s.pid=null;s.c=null;s.why="";}});autoPlan(false);}save();render();}
  else if(a==="insafter"){var ar3=state.plan[d],nk3="x"+Date.now();ar3.splice(i+1,0,{k:nk3,t:0,label:"加碼",hint:"sight",pid:null,c:null,st:"",why:""});save();sheet={d:d,i:i+1,mood:"any",src:"mine",offset:0,ai:null,aiSeen:[],busy:false,err:""};render();renderSheet();}
  else if(a==="insbefore"){var ar4=state.plan[d];ar4.splice(i,0,{k:"x"+Date.now(),t:0,label:"加碼",hint:"sight",pid:null,c:null,st:"",why:""});save();sheet={d:d,i:i,mood:"any",src:"mine",offset:0,ai:null,aiSeen:[],busy:false,err:""};render();renderSheet();}
  else if(a==="unfix"){delete state.plan[d][i].fix;save();render();}
  else if(a==="maprefresh"){mvView=null;state.mapSel=null;save();render();toast("地圖已更新");}
  else if(a==="pf"){state.pf=v;save();render();}
  else if(a==="aiday"){aiDay(d);}
  else if(a==="resetplan"){state.plan={};state.del={};state.zone={};rebuild();save();render();}
  else if(a==="reload"){render();}
  else if(a==="chk"){state.chk=state.chk||{};state.chk[v]=!state.chk[v];save();render();}
  else if(a==="quick"){var arr2=state.plan[d]||(state.plan[d]=[]),T={cafe:[990,"咖啡甜點","cafe"],food:[1110,"小吃餐廳","food"],shop:[870,"逛街","sight"],sight:[870,"景點","sight"],night:[1230,"夜景","night"]}[v],nk="x"+Date.now();
    arr2.push({k:nk,t:T[0],label:T[1],hint:T[2],pid:null,c:null,st:"",why:""});save();
    var ni2=0;arr2.forEach(function(q,qi){if(q.k===nk)ni2=qi;});
    sheet={d:d,i:ni2,mood:({food:"eat",cafe:"cafe",night:"night",shop:"shop"})[v]||"any",src:"mine",offset:0,ai:null,aiSeen:[],busy:false,err:""};render();renderSheet();}
  else if(a==="alt"){state.variant=(state.variant||0)+1;var c2=autoPlan(true);save();render();toast("換了一種排法，共 "+c2+" 段");}
  else if(a==="auto"||a==="autoAll"){var cnt=autoPlan(a==="autoAll");save();render();toast(cnt?"已排好 "+cnt+" 段":"沒有可以填的空白");}
  else if(a==="aiGap"){aiGap();}
  else if(a==="region"){var rg=regionList()[+v];if(rg){mvView={sig:mvView?mvView.sig:"",fit:false,rgn:{la:rg.la,lo:rg.lo,z:Math.max(2.6,8/(window.devicePixelRatio||1))}};render();}}
  else if(a==="mapday"){state.mapDay=+v;mvView=null;state.mapSel=null;save();render();}
  else if(a==="mapreg"){state.mapReg=v;save();render();}
  else if(a==="mapzoom"){state.mapZoom=!state.mapZoom;save();render();}

  else if(a==="mapclose"){state.mapSel=null;render();}
  else if(a==="addto"){addToDay(el.getAttribute("data-id"),d);}
  else if(a==="classify"){classify();}
}
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="fileIn"&&el.files&&el.files.length){msgImport="";Array.prototype.forEach.call(el.files,function(f){var rd=new FileReader();rd.onload=function(){importText(f.name,String(rd.result||""));};rd.readAsText(f);});return;}
  if(el.getAttribute&&el.getAttribute("data-fix")){var fd=+el.getAttribute("data-d"),fi=+el.getAttribute("data-i");if(el.value){state.plan[fd][fi].fix=toMin(el.value);}save();render();return;}
  var ok2=el.getAttribute&&el.getAttribute("data-oh");
  if(ok2){var pp=placeById(el.getAttribute("data-id"));if(pp){var cur2=hoursOf(pp),n2={o:cur2.o,c:cur2.c,off:(cur2.off||[]).slice()};
    if(ok2==="o")n2.o=toMin(el.value);else if(ok2==="c"){n2.c=toMin(el.value);if(n2.c<=n2.o)n2.c+=1440;}else n2.off=el.value===""?[]:[+el.value];
    n2.est=false;pp.oh=n2;save();render();}return;}
  var dk=el.getAttribute&&el.getAttribute("data-dset");
  if(dk){var dd=+el.getAttribute("data-d");dset(dd)[dk]=el.value;rebuild();autoPlan(false);save();render();return;}
  var k=el.getAttribute&&el.getAttribute("data-set");if(!k)return;
  if(k==="parea"){state.places[+el.getAttribute("data-i")].area=el.value;save();render();return;}
  if(k==="pcat"){state.places[+el.getAttribute("data-i")].cat=el.value;save();render();return;}
  if(k==="pq"){state.pq=el.value;render();return;}
  state.set[k]=el.value;if(k==="hotelArea")state.set.hotelCoord=null;
  if(k!=="hotelName"){rebuild();}
  save();
});

/* boot */
state=load()||defaults();
if(state.tab==="set")state.tab="places";
(function(){var fresh=myPlaces(),byName={},have={};fresh.forEach(function(p){byName[p.name]=p;});
  state.places.forEach(function(p){have[p.name]=1;if(p.src==="demo")p.pinned=false;var f=byName[p.name];if(p.src==="gmaps"&&f&&p.lat==null){p.lat=f.lat;p.lng=f.lng;p.area=f.area;p.rating=f.rating;p.rc=f.rc;p.hl=f.hl;}});
  state.gone=state.gone||{};var add=fresh.filter(function(p){return !have[p.name]&&!state.gone[p.name];});if(add.length)state.places=add.concat(state.places);})();
state.days=state.days||{};[1,2,3].forEach(function(d){state.days[d]=state.days[d]||{};});
if(state.set.imm==null)state.set.imm=90;if(!state.set.transit)state.set.transit="bus";
if(!state.mig5){state.mig5=1;state.del={};state.plan=state.plan||{};var anyF=false;
  for(var dm=1;dm<=3;dm++){(state.plan[dm]||[]);state.plan[dm]=(state.plan[dm]||[]).filter(function(s){return !(String(s.k).charAt(0)==="x"&&/^朋友行程/.test(s.why||""));});}
  rebuild();for(var dn=1;dn<=3;dn++)if((state.plan[dn]||[]).some(function(s){return slotItem(s);}))anyF=true;if(anyF)autoPlan(false);save();}
if(!state.mig7){state.mig7=1;state.places.forEach(function(p){if(p.name==='Liberta'&&p.cat==='other')p.cat='food';if(p.cat==='other'){var g=guessCat(p.name);if(g!=='other')p.cat=g;}});save();}
if(!state.mig6){state.mig6=1;state.places.forEach(function(p){p.on=true;});save();}
if(!state.plan||!state.plan[1])rebuild();
render();
(async function(){
  try{var c=window.claude&&await window.claude.use("sample");if(c){sampleFn=c;render();}}catch(e){}
})();
})();
